name: Import curated backgrounds

on:
  push:
    paths:
      - ".github/BACKGROUND_IMPORT_SOURCES.txt"
      - ".github/workflows/import_backgrounds.yml"

permissions:
  contents: write

jobs:
  import-backgrounds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download curated backgrounds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p BACKGROUNDS
          while IFS='|' read -r filename url source_page; do
            [ -z "$filename" ] && continue
            echo "Downloading $filename"
            curl -L --fail --retry 3 --retry-delay 2 "$url" -o "BACKGROUNDS/$filename"
            file "BACKGROUNDS/$filename"
          done < .github/BACKGROUND_IMPORT_SOURCES.txt

      - name: Remove temporary importer files
        shell: bash
        run: |
          rm -f .github/BACKGROUND_IMPORT_SOURCES.txt
          rm -f .github/workflows/import_backgrounds.yml

      - name: Commit imported images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BACKGROUNDS .github
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Collect 10 curated background images"
          git push
