name: Import Pixabay Outdoor Backgrounds

on:
  push:
    branches: [main]
    paths:
      - "PIXABAY_OUTDOOR_IMPORT.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-backgrounds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Pixabay backgrounds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p BACKGROUNDS

          while IFS='|' read -r filename image_url; do
            [ -z "${filename}" ] && continue
            [[ "${filename}" == #* ]] && continue

            target="BACKGROUNDS/${filename}"
            if [ -f "${target}" ]; then
              echo "SKIP existing: ${filename}"
              continue
            fi

            echo "Downloading ${filename}"
            curl -L --fail --retry 3 --retry-delay 2               -A "Mozilla/5.0"               -H "Referer: https://pixabay.com/"               "${image_url}"               -o "${target}"

            size=$(stat -c%s "${target}")
            if [ "${size}" -lt 50000 ]; then
              echo "Downloaded file is too small: ${filename} (${size} bytes)"
              rm -f "${target}"
              exit 1
            fi
          done < PIXABAY_OUTDOOR_IMPORT.txt

      - name: Commit imported backgrounds
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BACKGROUNDS
          if git diff --cached --quiet; then
            echo "No new backgrounds to commit."
            exit 0
          fi
          git commit -m "Import 10 Pixabay outdoor backgrounds"
          git push
