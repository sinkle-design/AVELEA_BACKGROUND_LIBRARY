name: Import Pixabay Outdoor Backgrounds

on:
  push:
    branches: [main]
    paths:
      - "PIXABAY_OUTDOOR_IMPORT.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-backgrounds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Pixabay backgrounds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import time

          manifest = Path("PIXABAY_OUTDOOR_IMPORT.txt")
          out_dir = Path("BACKGROUNDS")
          out_dir.mkdir(parents=True, exist_ok=True)

          rows = []
          for raw in manifest.read_text(encoding="utf-8").splitlines():
              raw = raw.strip()
              if not raw or raw.startswith("#"):
                  continue
              filename, image_url = raw.split("|", 1)
              rows.append((filename.strip(), image_url.strip()))

          downloaded = 0
          for filename, image_url in rows:
              dest = out_dir / filename
              if dest.exists():
                  print(f"SKIP existing: {filename}")
                  continue

              print(f"Downloading {filename}")
              req = Request(
                  image_url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Referer": "https://pixabay.com/",
                      "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
                  },
              )
              with urlopen(req, timeout=60) as r:
                  data = r.read()
                  content_type = r.headers.get_content_type()

              if not content_type.startswith("image/"):
                  raise RuntimeError(f"Unexpected content type {content_type}: {image_url}")
              if len(data) < 50000:
                  raise RuntimeError(f"Downloaded file too small ({len(data)} bytes): {filename}")

              dest.write_bytes(data)
              print(f"SAVED {dest} ({len(data)} bytes)")
              downloaded += 1
              time.sleep(0.5)

          print(f"Downloaded {downloaded} new backgrounds.")
          PY

      - name: Commit imported backgrounds
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BACKGROUNDS
          if git diff --cached --quiet; then
            echo "No new backgrounds to commit."
            exit 0
          fi
          git commit -m "Import 10 Pixabay outdoor backgrounds"
          git push
